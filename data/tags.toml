# Dicionário de tags: um conceito por tabela, com o nome da tag em cada idioma.
#
# - Os posts usam a tag no próprio idioma; a URL sai do nome (/tags/carreira/, /tags/career/).
# - scripts/tags.py sync gera content/<lang>/tags/<slug>/_index.md com translationKey "tag-<chave>",
#   que liga as páginas da mesma tag entre os três sites (seletor de idioma, hreflang).
# - Nome coincidente entre idiomas (sistemas em PT e ES, kung fu em todos): mesma chave, mesma
#   página ligada. Falso cognato (mesma grafia, sentido diferente): chaves separadas.
# - pt é exatamente o que o Silva usa (os posts PT vêm de lá); scripts/silvae.py traduz pt -> en/es
#   ao importar para outro idioma.

